version: 2
updates:
  - package-ecosystem: "pip"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"

    cooldown:

      default-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
