name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    # Shared Gitleaks, Checkov, Trivy and zizmor jobs.
    uses: DustyStudy/DustyStudy/.github/workflows/security-scan.yml@67f5198ed1669828263973e494b39d40f5647c46 # ci/reusable-security-scan
    permissions:
      contents: read
      security-events: write
      actions: read
    with:
      checkov: false # validate.yml runs it
