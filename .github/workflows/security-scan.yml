name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  scan:
    # Shared Gitleaks, Checkov, Trivy and zizmor jobs.
    uses: DustyStudy/DustyStudy/.github/workflows/security-scan.yml@237fae28cae3a52f29a19129ced1420d0bd9ef7f # DustyStudy/DustyStudy#33
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      actions: read
    with:
      checkov: false # validate.yml runs it
