name: release-please

on:
  push:
    branches: [main]

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false # never cancel a release PR update mid-flight

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # release-please opens/updates the release PR and, on merge, creates the
    # tag and a draft GitHub release (see release-please-config.json). The
    # build job publishes it. Write access is scoped to this job only.
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    # Build the wheel and sdist from the release tag with hash-pinned build
    # tools, produce a CycloneDX SBOM of the pinned runtime dependencies, and
    # attach signed build-provenance attestations to all of it. The release
    # stays a draft until every file is uploaded, then is published: a failed
    # build never leaves a half-filled release, and a published release is
    # never modified (so immutable releases can be on).
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload assets to the release
      id-token: write # sign the attestations (Sigstore)
      attestations: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            pypi.org:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install hash-pinned build tools
        run: python -m pip install --require-hashes -r requirements/release.txt

      - name: Build wheel and sdist
        run: python -m build --no-isolation --outdir dist .

      - name: SBOM of pinned runtime dependencies
        run: |
          cyclonedx-py requirements requirements/runtime.txt \
            --output-format JSON --output-file dist/aws-sso-broker.cdx.json
          cp requirements/runtime.txt dist/runtime-requirements.txt

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Add the attestation bundle
        # Scorecard and offline verifiers look for a signature or provenance file next to the
        # artifacts. The bundle covers every file above; prove it verifies them before it ships.
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          files=(dist/*)
          base="${GITHUB_REPOSITORY#*/}-${TAG}"
          cp "$BUNDLE" "dist/${base}.intoto.jsonl"
          head -n 1 "$BUNDLE" > "dist/${base}.sigstore.json"
          for f in "${files[@]}"; do
            gh attestation verify "$f" --bundle "dist/${base}.sigstore.json" --repo "$GITHUB_REPOSITORY"
          done

      - name: Upload to the draft release, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 7

  pypi:
    # Off until PyPI trusted publishing is configured for this repo (see
    # CONTRIBUTING.md): set the repository variable PYPI_PUBLISH to "true"
    # and create a "pypi" environment. No API token is ever stored.
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/aws-sso-broker
    permissions:
      id-token: write # PyPI trusted publishing; also signs PEP 740 attestations
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            upload.pypi.org:443
            pypi.org:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
