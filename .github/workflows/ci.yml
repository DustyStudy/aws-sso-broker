name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR instead of letting them pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: this workflow only ever reads the repo and
# talks to PyPI's package index (via pip) — it never needs to write
# anything back to GitHub. Nothing below grants more than this.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint-and-test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # File permissions, the keychain and the default shell all behave
        # differently per OS, so every supported OS runs the full suite.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Restricts what this job's runner can reach on the network and flags
      # anything unexpected (e.g. a compromised dependency trying to phone
      # home or exfiltrate secrets). audit mode logs without blocking, to
      # start; see SECURITY.md for the plan to move this to block mode
      # once the egress allowlist below is confirmed complete.
      - name: Harden Runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        shell: bash
        run: |
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps -e .

      - name: Pytest
        run: pytest -v --cov=ssobroker --cov-report=term-missing
