[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-sso-broker"
version = "0.2.2"
description = "Ephemeral AWS multi-account credential broker built on IAM Identity Center (SSO) — no long-lived keys, no key exports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dusty" }]
keywords = ["aws", "sso", "identity-center", "multi-account", "credentials", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = [
    "boto3>=1.34",
    "click>=8.1",
    "PyYAML>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "boto3-stubs[sso,sso-oidc,iam,sts,logs]>=1.34",
]
keyring = [
    "keyring>=24.0",
]
# Windows Event Log forwarding (audit_forward: [eventlog]).
windows = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
ssobroker = "ssobroker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssobroker = ["py.typed", "examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter, not the linter

[tool.mypy]
python_version = "3.11"
packages = ["ssobroker"]
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# Not yet fully strict — the codebase leans on dataclasses and dict-shaped
# AWS API responses that would need more precise typing (TypedDicts) to pass
# under --strict. This is a reasonable middle ground to start from.
disallow_untyped_defs = false
check_untyped_defs = true
