# ~/.ssobroker/guardrails.yaml — optional local speed bumps.
# This is NOT a security boundary (IAM permission boundaries / SCPs are).
# It's a client-side check to catch fat-fingered commands before they
# reach AWS, and to force a confirmation prompt on risky-but-legitimate ones.

# Account IDs where ANY command via `ssobroker exec`/`shell` is blocked outright.
# Useful for a management/root account you never want ad-hoc commands against.
# Does NOT cover `export-env` or `creds-process` — those are meant to work
# non-interactively (wired into ~/.aws/config, a script, or CI), so blocking
# them here would just break that use case rather than add friction to it.
# Set strict_protected_accounts: true (below) to block them there too.
protected_account_ids:
  - "111111111111"

# Also refuse protected accounts in `export-env` and `creds-process`. With this
# on, `aws --profile <protected>` fails instead of quietly getting credentials.
# The machine policy can force this on; this file can't turn it off then.
# strict_protected_accounts: true

# Glob patterns (fnmatch-style) matched against the full joined command string.
# Anything matching here is blocked, in addition to the tool's built-in defaults
# (delete-account-alias, leave-organization, close-account, recursive S3 rm, etc).
# "aws*<service>" rather than "aws <service>" also matches when a global flag
# sits in between ("aws --region x kms ..."). Patterns match from the start of
# the command, so a wrapper ("sudo aws ...", "bash -c ...") is not caught.
# Only `ssobroker exec` checks these; `aws --profile` via creds-process does not.
deny_patterns:
  - "aws*iam delete-role*"
  - "aws*ec2 terminate-instances*"
  # Uncomment what fits your org:
  # - "aws*kms schedule-key-deletion*"
  # - "aws*kms disable-key*"
  # - "aws*cloudtrail delete-trail*"
  # - "aws*cloudtrail stop-logging*"
  # - "aws*guardduty delete-detector*"
  # - "aws*s3api delete-bucket *"
  # - "aws*s3api put-bucket-policy*"
  # - "aws*rds delete-db-instance*--skip-final-snapshot*"
  # - "aws*rds delete-db-cluster*--skip-final-snapshot*"
  # - "aws*dynamodb delete-table*"
  # - "aws*iam create-access-key*"
  # - "terraform destroy*"

# Patterns that are allowed but require an interactive y/N confirmation
# (skip with `--yes` for scripted/CI use where you trust the caller).
# With no terminal to ask (CI, a pipe), the answer is no.
require_confirmation_patterns:
  - "aws*s3 rm*"
  - "aws*rds delete-db-instance*"
  - "aws*cloudformation delete-stack*"
  # - "terraform apply*"
  # - "aws*ec2 stop-instances*"
